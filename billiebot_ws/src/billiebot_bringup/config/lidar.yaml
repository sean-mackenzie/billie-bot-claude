# RPLidar A1 driver parameters (rung 01).
#
# serial_port uses the stable /dev/serial/by-id/ symlink, matching the convention in
# billiebot_base/config/base_driver.yaml. Plain ttyUSBn indices are assigned in plug-in
# order and swap between the lidar and the Arduino (GAP-20). No custom udev rule is
# needed -- systemd-udev's stock 60-serial.rules creates this symlink.
#
# The CP2102 serial "0001" is Silicon Labs' factory default; it is unique here only
# because the robot has exactly one CP2102. See INSTALLATION_AND_SETUP.md 2.2.4.
rplidar_node:
  ros__parameters:
    serial_port: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
    serial_baudrate: 115200
    frame_id: laser_frame
    angle_compensate: true
    scan_mode: Standard
