[develop]
script_dir=$base/lib/billiebot_perception

[install]
install_scripts=$base/lib/billiebot_perception

[tool:pytest]
# anyio (a transitive dep of fastapi/starlette, installed for billiebot_cognition's
# report server) registers a pytest11 plugin that requires a newer pytest-internals API
# than the apt-pinned python3-pytest provides, which crashes plugin autoload before any
# test file is even collected. Disabling just that one plugin is the scoped fix -- it has
# no effect on this package's own tests, which never touch fastapi/anyio.
addopts = -p no:anyio
