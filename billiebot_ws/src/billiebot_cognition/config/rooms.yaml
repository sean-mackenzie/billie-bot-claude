# Room boundary definitions for mapping (x, y) positions to room names.
# Update these after mapping your apartment.
# Coordinates are in map frame.

rooms:
  living_room:
    x_min: -1.0
    x_max: 3.0
    y_min: -1.0
    y_max: 2.0

  kitchen:
    x_min: 2.5
    x_max: 5.0
    y_min: 0.0
    y_max: 3.0

  bedroom:
    x_min: -3.0
    x_max: -0.5
    y_min: 1.0
    y_max: 4.0

  hallway:
    x_min: -0.5
    x_max: 2.5
    y_min: 1.5
    y_max: 2.5

  bathroom:
    x_min: 1.0
    x_max: 3.0
    y_min: 2.5
    y_max: 5.0
